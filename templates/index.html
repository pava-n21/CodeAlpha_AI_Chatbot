<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduBot - AI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>


    <div class="chat-container">

        <!-- HEADER -->

        <div class="chat-header">

            <div class="bot-avatar">
                🤖
            </div>

            <div class="header-text">

                <h1>EduBot</h1>

                <p>
                    Your AI-powered virtual assistant
                </p>

                <div class="online-status">
                    <span class="status-dot"></span>
                    Online
                </div>

            </div>

        </div>


        <!-- CHAT AREA -->

        <div id="chat-box" class="chat-box">

            <div class="welcome-message">

                <div class="welcome-icon">
                    ✨
                </div>

                <h2>Welcome to EduBot!</h2>

                <p>
                    Ask me anything. I'm here to help you.
                </p>

            </div>


            <!-- Initial Bot Message -->

            <div class="message bot-message">

                <div class="avatar-small">
                    🤖
                </div>

                <div class="message-content">

                    Hello! 👋

                    <br>

                    How can I help you today?

                </div>

            </div>

        </div>


        <!-- INPUT AREA -->

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your message here..."
                autocomplete="off"
            >

            <button id="send-button">

                <span>Send</span>

                <span class="send-icon">
                    ➤
                </span>

            </button>

        </div>


        <!-- FOOTER -->

        <div class="chat-footer">

            <span>Powered by</span>

            <strong>Python • Flask • Machine Learning</strong>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
